name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deploy at a time; a newer push cancels a queued (not running) deploy.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # The site's typeface is licensed and gitignored (see
      # apps/web/src/fonts/README.md). It lives in the private
      # Julioliolio/portfolio-fonts repo, checked out here with a read-only
      # deploy key stored as the FONTS_DEPLOY_KEY secret.
      - uses: actions/checkout@v4
        with:
          repository: Julioliolio/portfolio-fonts
          ssh-key: ${{ secrets.FONTS_DEPLOY_KEY }}
          path: .fonts-private
      - run: cp .fonts-private/*.woff2 apps/web/src/fonts/
      - uses: pnpm/action-setup@v4 # version comes from package.json packageManager
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Builds every apps/demos/* into apps/web/public/demos, then exports
      # the Next app to apps/web/out.
      - run: pnpm build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: apps/web/out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
